name: Build KRAIN Nitro Node Image

on:
  push:
    branches: [axon-aivm]
  workflow_dispatch:

jobs:
  build:
    name: Build & push krain-nitro-dev image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: nitro-node-dev
          push: true
          tags: |
            ghcr.io/bedda-tech/nitro:axon-aivm
            ghcr.io/bedda-tech/nitro:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## KRAIN Nitro Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull with: \`docker pull ghcr.io/bedda-tech/nitro:axon-aivm\`" >> $GITHUB_STEP_SUMMARY
          echo "Re-tag: \`docker tag ghcr.io/bedda-tech/nitro:axon-aivm krain-nitro-dev:latest\`" >> $GITHUB_STEP_SUMMARY
